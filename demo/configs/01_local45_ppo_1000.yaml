behaviors:
  Local45StandaloneAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 128
      buffer_size: 512
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 1
    checkpoint_interval: 1000
    max_steps: 1000
    time_horizon: 64
    summary_freq: 250

engine_settings:
  time_scale: 10
  target_frame_rate: -1
  capture_frame_rate: 60
