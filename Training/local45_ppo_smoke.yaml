behaviors:
  GambitAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 2048
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 2
    checkpoint_interval: 5000
    max_steps: 10000
    time_horizon: 128
    summary_freq: 1000

engine_settings:
  time_scale: 10
  target_frame_rate: -1
  capture_frame_rate: 60
